name: Daily Market Pulse

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t market-pulse-pipeline .

      - name: Run pipeline in container
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          docker run \
            -e GOOGLE_SERVICE_ACCOUNT_JSON \
            -e SHEET_ID \
            -e FRED_API_KEY \
            -v "$(pwd)/logs:/app/logs" \
            market-pulse-pipeline

      - name: Commit run log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/latest_run.log
          git commit -m "Update pipeline run log [skip ci]" || echo "No changes to commit"
          git push